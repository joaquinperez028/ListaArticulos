<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lista de artículos</title>
<style>
  :root { color-scheme: light dark; --fondo: #f5f5f4; --tarjeta: #fff; --texto: #1c1917; --suave: #78716c; --acento: #2563eb; }
  @media (prefers-color-scheme: dark) { :root { --fondo: #1c1917; --tarjeta: #292524; --texto: #f5f5f4; --suave: #a8a29e; } }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--fondo); color: var(--texto); }
  main { max-width: 1000px; margin: 0 auto; padding: 24px 16px; }
  form { display: grid; gap: 8px; background: var(--tarjeta); padding: 16px; border-radius: 12px; margin-bottom: 24px; }
  input, textarea, button { font: inherit; padding: 10px; border-radius: 8px; border: 1px solid #a8a29e55; background: transparent; color: inherit; }
  button { background: var(--acento); color: #fff; border: none; cursor: pointer; }
  button:disabled { opacity: .6; }
  #lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  .tarjeta { background: var(--tarjeta); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  .tarjeta img, .sinPortada { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #a8a29e33; display: grid; place-items: center; color: var(--suave); }
  .cuerpo { padding: 12px; display: grid; gap: 6px; flex: 1; align-content: start; }
  .cuerpo h2 { margin: 0; font-size: 1.05rem; }
  .cuerpo h2 a { color: inherit; text-decoration: none; }
  .cuerpo h2 a:hover { text-decoration: underline; }
  .cuerpo p { margin: 0; color: var(--suave); font-size: .9rem; white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .enlacePortada { display: block; }
  #detalle { width: min(720px, calc(100% - 32px)); max-height: calc(100% - 32px); padding: 0; border: none; border-radius: 12px; background: var(--tarjeta); color: var(--texto); }
  #detalle::backdrop { background: #0009; }
  #detalle img, #detalle .sinPortada { width: 100%; max-height: 60vh; object-fit: contain; background: #a8a29e22; display: block; }
  #detalle .sinPortada { aspect-ratio: 16/9; display: grid; place-items: center; color: var(--suave); }
  .contenidoDetalle { padding: 20px; display: grid; gap: 12px; }
  .contenidoDetalle h2 { margin: 0; }
  .contenidoDetalle p { margin: 0; white-space: pre-wrap; line-height: 1.5; }
  .datosDetalle { color: var(--suave); font-size: .85rem; }
  .accionesDetalle { display: flex; gap: 8px; justify-content: flex-end; }
  .accionesDetalle a { background: var(--acento); color: #fff; padding: 10px 16px; border-radius: 8px; text-decoration: none; }
  .accionesDetalle button { background: transparent; color: inherit; border: 1px solid #a8a29e55; }
  .zonaImagen { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; border: 1px dashed #a8a29e88; border-radius: 8px; padding: 10px; color: var(--suave); font-size: .9rem; }
  .zonaImagen img { height: 64px; border-radius: 6px; }
  .zonaImagen button { padding: 4px 10px; background: transparent; color: var(--suave); border: 1px solid #a8a29e55; }
  .pestanas { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid #a8a29e55; margin-bottom: 8px; }
  .pestanas a { padding: 10px 16px; color: var(--suave); text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .pestanas a:hover { color: var(--texto); }
  .pestanas a[aria-current="page"] { color: var(--texto); border-bottom-color: var(--acento); font-weight: 600; }
  .pestanas button, .encabezadoLista button { background: transparent; color: var(--suave); border: 1px solid #a8a29e55; padding: 6px 12px; font-size: .85rem; }
  .pestanas button { margin: 4px 0 4px auto; }
  .encabezadoLista { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .aviso { background: var(--tarjeta); border-left: 4px solid var(--acento); border-radius: 12px; padding: 16px 20px; margin-bottom: 24px; }
  .aviso h2 { margin: 0 0 6px; font-size: 1.1rem; }
  .aviso p { margin: 0; line-height: 1.5; }
  body:not(.modoAdmin) .soloAdmin, .modoAdmin .soloVisitante { display: none !important; }
  footer { max-width: 1000px; margin: 0 auto; padding: 8px 16px 32px; color: var(--suave); font-size: .85rem; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  footer summary { cursor: pointer; }
  footer form { display: flex; gap: 8px; padding: 8px 0 0; margin: 0; background: none; }
  footer input, footer button { padding: 6px 10px; }
  #salirAdmin { background: transparent; color: var(--suave); border: 1px solid #a8a29e55; }
  .accionesTarjeta { display: flex; gap: 4px; justify-content: flex-end; }
  .accionTarjeta { background: transparent; color: var(--suave); padding: 4px 6px; font-size: .85rem; }
  .accionTarjeta:hover { color: var(--texto); }
  .botonesFormulario { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  #cancelarEdicion { background: transparent; color: inherit; border: 1px solid #a8a29e55; }
</style>
</head>
<body>
<main>
  <nav class="pestanas" id="pestanas" aria-label="Listas"></nav>
  <div class="encabezadoLista">
    <h1 id="tituloLista">Lista de artículos</h1>
    <button type="button" id="renombrarLista" class="soloAdmin">Renombrar</button>
  </div>
  <form id="formulario" class="soloAdmin">
    <input name="nombre" placeholder="Nombre del artículo" required>
    <textarea name="descripcion" placeholder="Descripción" rows="2"></textarea>
    <input name="link" type="url" placeholder="https://..." required>
    <div class="zonaImagen">
      <label>Imagen propia (opcional): <input type="file" id="selectorImagen" accept="image/png,image/jpeg,image/gif,image/webp"></label>
      <span>o pegá una imagen con Ctrl+V</span>
      <img id="vistaPrevia" alt="Vista previa" hidden>
      <button type="button" id="quitarImagen" hidden>Quitar</button>
    </div>
    <div class="botonesFormulario">
      <button id="botonAgregar">Agregar</button>
      <button type="button" id="cancelarEdicion" hidden>Cancelar</button>
    </div>
  </form>
  <section class="aviso">
    <h2>Sobre los regalos</h2>
    <p>Si bien me encantaría recibir cualquiera de estos artículos completo, con el simple hecho de contribuir con una parte del regalo ya sería muy feliz y me ayudaría un montón</p>
  </section>
  <div id="lista"></div>
</main>
<footer>
  <details class="soloVisitante">
    <summary>Administrar</summary>
    <form id="formularioAdmin">
      <input type="password" id="claveAdmin" placeholder="Clave" autocomplete="current-password" required>
      <button>Entrar</button>
    </form>
  </details>
  <span class="soloAdmin">Modo administrador</span>
  <button type="button" id="salirAdmin" class="soloAdmin">Salir</button>
</footer>
<dialog id="detalle">
  <div id="portadaDetalle"></div>
  <div class="contenidoDetalle">
    <h2 id="nombreDetalle"></h2>
    <div class="datosDetalle" id="datosDetalle"></div>
    <p id="descripcionDetalle"></p>
    <div class="accionesDetalle">
      <button type="button" id="cerrarDetalle">Cerrar</button>
      <a id="linkDetalle" target="_blank" rel="noopener">Abrir link ↗</a>
    </div>
  </div>
</dialog>
<script>
  const formulario = document.getElementById('formulario');
  const lista = document.getElementById('lista');
  const selectorImagen = document.getElementById('selectorImagen');
  const vistaPrevia = document.getElementById('vistaPrevia');
  const quitarImagen = document.getElementById('quitarImagen');
  const tiposPermitidos = ['image/png', 'image/jpeg', 'image/gif', 'image/webp'];
  let imagenPropia = null; // data URL de la imagen elegida o pegada
  const articulosPorId = new Map();
  const detalle = document.getElementById('detalle');
  let claveAdmin = null;
  try { claveAdmin = sessionStorage.getItem('claveAdmin'); } catch {}

  function activarModoAdmin(clave) {
    claveAdmin = clave;
    try { clave ? sessionStorage.setItem('claveAdmin', clave) : sessionStorage.removeItem('claveAdmin'); } catch {}
    document.body.classList.toggle('modoAdmin', !!clave);
  }
  activarModoAdmin(claveAdmin);

  document.getElementById('formularioAdmin').onsubmit = async (evento) => {
    evento.preventDefault();
    const clave = document.getElementById('claveAdmin').value;
    const respuesta = await fetch('/api/sesion', { method: 'POST', headers: { 'x-clave-admin': clave } });
    if (!respuesta.ok) return alert('Clave incorrecta');
    document.getElementById('claveAdmin').value = '';
    activarModoAdmin(clave);
  };
  document.getElementById('salirAdmin').onclick = () => activarModoAdmin(null);

  function usarImagen(archivo) {
    if (!tiposPermitidos.includes(archivo.type)) return alert('La imagen debe ser PNG, JPG, GIF o WEBP');
    if (archivo.size > 3 * 1024 * 1024) return alert('La imagen no puede superar 3 MB');
    const lector = new FileReader();
    lector.onload = () => {
      imagenPropia = lector.result;
      vistaPrevia.src = imagenPropia;
      vistaPrevia.hidden = quitarImagen.hidden = false;
    };
    lector.readAsDataURL(archivo);
  }

  // Edición: el formulario de arriba se reutiliza para modificar un artículo existente
  let articuloEditando = null;
  let modoPortada = 'mantener'; // 'mantener' la portada actual o volver a la 'automatica' del link

  function limpiarImagen() {
    if (articuloEditando) modoPortada = 'automatica';
    imagenPropia = null;
    selectorImagen.value = '';
    vistaPrevia.removeAttribute('src');
    vistaPrevia.hidden = quitarImagen.hidden = true;
  }

  selectorImagen.onchange = () => selectorImagen.files[0] && usarImagen(selectorImagen.files[0]);
  quitarImagen.onclick = limpiarImagen;
  document.addEventListener('paste', (evento) => {
    const archivo = [...evento.clipboardData.files].find(f => f.type.startsWith('image/'));
    if (archivo && claveAdmin) { evento.preventDefault(); usarImagen(archivo); }
  });

  function crearPortada(articulo) {
    const sinPortada = () => Object.assign(document.createElement('div'), { className: 'sinPortada', textContent: 'Sin portada' });
    if (!articulo.portada) return sinPortada();
    const portada = Object.assign(document.createElement('img'), { src: articulo.portada, alt: '', loading: 'lazy' });
    portada.onerror = () => portada.replaceWith(sinPortada());
    return portada;
  }

  function crearTarjeta(articulo) {
    articulosPorId.set(articulo.id, articulo);
    const tarjeta = document.createElement('article');
    tarjeta.className = 'tarjeta';
    tarjeta.dataset.id = articulo.id;
    const enlacePortada = Object.assign(document.createElement('a'), { href: `#${articulo.id}`, className: 'enlacePortada', tabIndex: -1 });
    enlacePortada.setAttribute('aria-hidden', 'true');
    enlacePortada.append(crearPortada(articulo));
    const cuerpo = document.createElement('div');
    cuerpo.className = 'cuerpo';
    const titulo = document.createElement('h2');
    const enlace = Object.assign(document.createElement('a'), { href: `#${articulo.id}`, textContent: articulo.nombre });
    titulo.append(enlace);
    const descripcion = Object.assign(document.createElement('p'), { textContent: articulo.descripcion });
    const botonEditar = Object.assign(document.createElement('button'), { className: 'accionTarjeta', textContent: 'Editar' });
    botonEditar.onclick = () => editarArticulo(articulo);
    const botonBorrar = Object.assign(document.createElement('button'), { className: 'accionTarjeta', textContent: 'Eliminar' });
    botonBorrar.onclick = async () => {
      if (!confirm(`¿Eliminar "${articulo.nombre}"?`)) return;
      const respuesta = await fetch(`/api/articulos/${articulo.id}?lista=${listaActual}`, { method: 'DELETE', headers: { 'x-clave-admin': claveAdmin } });
      if (!respuesta.ok && respuesta.status !== 404) return alert((await respuesta.json()).error);
      articulosPorId.delete(articulo.id);
      if (articuloEditando?.id === articulo.id) terminarEdicion();
      tarjeta.remove();
    };
    const acciones = Object.assign(document.createElement('div'), { className: 'accionesTarjeta soloAdmin' });
    acciones.append(botonEditar, botonBorrar);
    cuerpo.append(titulo, descripcion, acciones);
    tarjeta.append(enlacePortada, cuerpo);
    return tarjeta;
  }

  // Pestaña elegida en ?lista=; cada una tiene sus propios artículos
  let listaActual = new URLSearchParams(location.search).get('lista');

  async function cargarPestanas() {
    const listas = await (await fetch('/api/listas')).json();
    if (!listas.some(lista => lista.id === listaActual)) listaActual = listas[0].id;
    const pestanas = listas.map(lista => {
      const pestana = Object.assign(document.createElement('a'), { href: `?lista=${lista.id}`, textContent: lista.nombre });
      if (lista.id === listaActual) {
        pestana.setAttribute('aria-current', 'page');
        document.getElementById('tituloLista').textContent = `Lista de ${lista.nombre}`;
        document.title = `Lista de ${lista.nombre}`;
      }
      return pestana;
    });
    const botonNuevaLista = Object.assign(document.createElement('button'), { type: 'button', className: 'soloAdmin', textContent: '+ Nueva lista' });
    botonNuevaLista.onclick = crearLista;
    document.getElementById('pestanas').replaceChildren(...pestanas, botonNuevaLista);
  }

  // Crear y renombrar mandan el nombre al servidor, que valida la clave de administrador
  async function enviarLista(metodo, url, nombre) {
    const respuesta = await fetch(url, {
      method: metodo,
      headers: { 'Content-Type': 'application/json', 'x-clave-admin': claveAdmin },
      body: JSON.stringify({ nombre }),
    });
    const datos = await respuesta.json();
    if (!respuesta.ok) { alert(datos.error); return null; }
    return datos;
  }

  async function crearLista() {
    const nombre = prompt('Nombre de la nueva lista:');
    if (!nombre?.trim()) return;
    const lista = await enviarLista('POST', '/api/listas', nombre);
    if (lista) location.href = `?lista=${lista.id}`;
  }

  document.getElementById('renombrarLista').onclick = async () => {
    const nombreActual = document.getElementById('tituloLista').textContent.replace(/^Lista de /, '');
    const nombre = prompt('Nuevo nombre de la lista:', nombreActual);
    if (!nombre?.trim() || nombre.trim() === nombreActual) return;
    if (await enviarLista('PATCH', `/api/listas?id=${listaActual}`, nombre)) cargarPestanas();
  };

  async function cargarArticulos() {
    await cargarPestanas();
    const articulos = await (await fetch(`/api/articulos?lista=${listaActual}`)).json();
    lista.replaceChildren(...articulos.map(crearTarjeta));
    mostrarDetalleSegunUrl();
  }

  // La URL #<id> abre el detalle: se puede compartir y el botón Atrás lo cierra
  function mostrarDetalleSegunUrl() {
    const articulo = articulosPorId.get(location.hash.slice(1));
    if (!articulo) return detalle.open && detalle.close();
    const portada = crearPortada(articulo);
    portada.loading = 'eager';
    document.getElementById('portadaDetalle').replaceChildren(portada);
    document.getElementById('nombreDetalle').textContent = articulo.nombre;
    document.getElementById('descripcionDetalle').textContent = articulo.descripcion || 'Sin descripción';
    const fecha = new Date(Number(articulo.id)).toLocaleDateString('es', { dateStyle: 'long' });
    document.getElementById('datosDetalle').textContent = `${new URL(articulo.link).hostname} · agregado el ${fecha}`;
    document.getElementById('linkDetalle').href = articulo.link;
    if (!detalle.open) detalle.showModal();
  }

  window.addEventListener('hashchange', mostrarDetalleSegunUrl);
  function limpiarUrl() {
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  }
  function cerrarDetalle() {
    detalle.close();
    limpiarUrl();
  }
  document.getElementById('cerrarDetalle').onclick = cerrarDetalle;
  detalle.onclick = (evento) => { if (evento.target === detalle) cerrarDetalle(); }; // click en el fondo
  detalle.onclose = limpiarUrl; // cierre con Esc

  const botonAgregar = document.getElementById('botonAgregar');
  const cancelarEdicion = document.getElementById('cancelarEdicion');

  function editarArticulo(articulo) {
    terminarEdicion();
    articuloEditando = articulo;
    modoPortada = 'mantener';
    formulario.nombre.value = articulo.nombre;
    formulario.descripcion.value = articulo.descripcion;
    formulario.link.value = articulo.link;
    if (articulo.portada) {
      vistaPrevia.src = articulo.portada;
      vistaPrevia.hidden = quitarImagen.hidden = false;
    }
    botonAgregar.textContent = 'Guardar cambios';
    cancelarEdicion.hidden = false;
    formulario.scrollIntoView({ behavior: 'smooth', block: 'start' });
    formulario.nombre.focus({ preventScroll: true });
  }

  function terminarEdicion() {
    articuloEditando = null;
    formulario.reset();
    limpiarImagen();
    botonAgregar.textContent = 'Agregar';
    cancelarEdicion.hidden = true;
  }
  cancelarEdicion.onclick = terminarEdicion;

  formulario.onsubmit = async (evento) => {
    evento.preventDefault();
    const textoBoton = botonAgregar.textContent;
    botonAgregar.disabled = true;
    botonAgregar.textContent = 'Guardando...';
    const campos = Object.fromEntries(new FormData(formulario));
    const pedido = articuloEditando
      ? { url: `/api/articulos/${articuloEditando.id}?lista=${listaActual}`, method: 'PATCH', imagen: imagenPropia || modoPortada }
      : { url: `/api/articulos?lista=${listaActual}`, method: 'POST', imagen: imagenPropia };
    const respuesta = await fetch(pedido.url, {
      method: pedido.method,
      headers: { 'Content-Type': 'application/json', 'x-clave-admin': claveAdmin },
      body: JSON.stringify({ ...campos, imagen: pedido.imagen }),
    });
    const datos = await respuesta.json();
    botonAgregar.disabled = false;
    botonAgregar.textContent = textoBoton;
    if (!respuesta.ok) return alert(datos.error);
    if (articuloEditando) lista.querySelector(`[data-id="${datos.id}"]`)?.replaceWith(crearTarjeta(datos));
    else lista.prepend(crearTarjeta(datos));
    terminarEdicion();
  };

  cargarArticulos();
</script>
</body>
</html>
